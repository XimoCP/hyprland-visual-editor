# @Title: looper
# @Icon: infinity
# @Color: #cba6f7
# @Tag: LOOP
# @Desc: Looper Aesthetic: Noctalia colors with Joker structure and glow.

# ------------------------------------------------------
# Optimized by HVE
# ------------------------------------------------------

general {
    border_size = 2

    # ---Looper's Flow---
    # We use the Noctalia palette: Primary -> Secondary -> Tertiary -> Error -> Primary
    col.active_border = $primary $secondary $tertiary 45deg

    # Inactive: Very dark and subtle (matching Joker style)
    col.inactive_border = rgba(1a002655)
}

decoration {
    # ---Noctalia Glow---
    shadow {
        enabled = true
        range = 18 # A slightly wider aura for the Looper effect
        render_power = 3

        # We use deep purple for the shadow to match Joker aesthetic.
        # By rotating the Noctalia colors on this purple background, a vibrant optical effect is created.
        color = rgba(ffffff44)

        offset = 0 0
    }
}

animations {
    enabled = yes

    # Constant flow curve
    bezier = nv_looper_flow, 0.4, 0, 0.2, 1

    # Speed 30: A constant turn that maintains dynamism
    animation = borderangle, 1, 30, nv_looper_flow, loop
}
