[dock]
active_scale = 1.5000000223517418
background_opacity = 0.79999998211860657
cross_axis_padding = 5
enabled = true
icon_size = 24
item_spacing = 10
launcher_position = "start"
magnification_scale = 2.0
main_axis_padding = 15
margin_edge = 5
margin_ends = 27
radius = 25
radius_bottom_left = 25
radius_bottom_right = 25
reserve_space = false
smart_auto_hide = true

[hooks]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
