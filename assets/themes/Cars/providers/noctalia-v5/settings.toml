[osd]
background_opacity = 0.84999998100101948

[plugin_settings."kenn/keybind-cheatsheet"]
columns = 4
compositor = "hyprland"
hyprland_config = "~/.config/hypr/configs/keybinds.conf"
hyprland_lua_config = "~/.config/hypr/configs/keybinds.lua"
hyprland_parser = "lua"
show_actions = true

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 60
terminal = "kitty"

[plugins]
enabled = [ "yuuto/arch-updater", "kenn/keybind-cheatsheet" ]

[shell]
app_icon_color = "secondary"
lang = "es"
password_style = "random"
polkit_agent = true
telemetry_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true

    [shell.session]
    grid_columns = 5

[theme]
builtin = "Ayu"
community_palette = "Garnet"
custom_palette = "skwd-wall"
mode = "dark"
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "sddm", "opencode", "pywalfox", "neovim", "vscode", "hyprtoolkit" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    interval_seconds = 600
    recursive = false

    [wallpaper.default]

    [wallpaper.last]

    [wallpaper.monitors.DP-3]

    [wallpaper.monitors.FALLBACK]

    [wallpaper.monitors.HDMI-A-1]

[widget.battery]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
color = "secondary"
scale = 1.3

[widget.media]
color = "secondary"
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.network_rx]
stat = "gpu_temp"

[widget.network_tx]
stat = "cpu_temp"

[widget.notifications]
color = "secondary"

[widget.spacer_2]
length = 25
type = "spacer"

[widget.spacer_3]
length = 25
type = "spacer"

[widget.spacer_4]
enabled = false
length = 25
type = "spacer"

[widget.sysmon]
stat = "gpu_usage"

[widget.tray]
drawer = true

[widget.wallpaper]
enabled = false

[widget.widget]
type = "yuuto/arch-updater:widget"