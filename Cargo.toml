[package]
name = "hve"
version = "1.0.0"
edition = "2021"
description = "Hyprland Visual Editor — Standalone"
authors = ["XimoCP"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
