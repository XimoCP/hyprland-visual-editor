[package]
name = "hve"
version = "1.0.0"
edition = "2021"
description = "Hyprland Visual Editor — Standalone"
authors = ["XimoCP"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/XimoCP/hyprland-visual-editor"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = "0.25"
# ksni 0.3 WITHOUT its default `tokio` runtime: the lock already resolves
# ksni 0.3.5 on `async-io` (slint's own dependency) and cargo unifies features,
# so asking for `tokio` would add a whole runtime and trip ksni's own
# "Features tokio and async-io cannot be enabled at the same time" error.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
slint = "1.17"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# W1d: the theme-trust detector parses a package's `settings.toml` with a
# REAL TOML parser instead of reading it line by line. `preserve_order`
# keeps the report in file order (the documented report contract and the
# warning's reading order).
toml = { version = "1.1", features = ["preserve_order"] }
usvg = "0.45"
libc = "0.2.189"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
i-slint-core = "1.17"
# B7: the shutdown-flush wiring test parses `main` with a real AST instead of
# grepping its source, so removing/reordering/nesting the call is detected.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[profile.dev]
codegen-units = 256
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
