[package]
name = "hve"
version = "1.0.0"
edition = "2021"
description = "Hyprland Visual Editor — Standalone"
authors = ["XimoCP"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/XimoCP/hyprland-visual-editor"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = "0.25"
ksni = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
slint = "1.17"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usvg = "0.45"
libc = "0.2.189"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
i-slint-core = "1.17"
# B7: the shutdown-flush wiring test parses `main` with a real AST instead of
# grepping its source, so removing/reordering/nesting the call is detected.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[profile.dev]
codegen-units = 256
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
