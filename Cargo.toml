[package]
name = "hve"
version = "1.0.0"
edition = "2021"
description = "Hyprland Visual Editor — Standalone"
authors = ["XimoCP"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
slint = "1.17"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usvg = "0.45"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
serial_test = "3"

[profile.dev]
codegen-units = 256
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
